    <script type="text/babel">

        const createAuthUser = async (email, password) => {
            const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${window.FIREBASE_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, returnSecureToken: false })
            });
            const data = await res.json();
            if(data.error) throw new Error(data.error.message);
            return data;
        };

        const handleDownloadPhoto = async (photoUrl, photoName = "Dokumentasi_SIWASGJ.jpg") => {
            try {
                const response = await fetch(photoUrl);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = photoName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(url);
            } catch (error) {
                window.open(photoUrl, '_blank');
            }
        };

        const exportToExcel = (studentsList, pengumuman, adminUsers, showToast) => {
            try {
                const wb = XLSX.utils.book_new();

                const santriData = studentsList.map(s => ({
                    "NIS": s.nis,
                    "Nama Lengkap": s.nama,
                    "Tempat Lahir": s.tempatLahir,
                    "Tanggal Lahir": s.tglLahir,
                    "Kelas": s.kelas,
                    "Kamar": s.kamar,
                    "Nama Wali": s.namaWali,
                    "No HP Wali": s.noHpWali,
                    "Kata Sandi Wali": s.sandi || '123456'
                }));
                const wsSantri = XLSX.utils.json_to_sheet(santriData);
                XLSX.utils.book_append_sheet(wb, wsSantri, "Data Santri");

                const pengumumanData = pengumuman.map(p => ({
                    "Judul Pengumuman": p.title,
                    "Kategori": p.type,
                    "Tanggal": p.date,
                    "Isi Keterangan": p.desc
                }));
                const wsPengumuman = XLSX.utils.json_to_sheet(pengumumanData);
                XLSX.utils.book_append_sheet(wb, wsPengumuman, "Pengumuman");

                const adminData = adminUsers.map(a => ({
                    "Nama Pengurus": a.nama,
                    "Username": a.username,
                    "Hak Akses (Role)": a.role,
                    "Kata Sandi": a.sandi
                }));
                const wsAdmin = XLSX.utils.json_to_sheet(adminData);
                XLSX.utils.book_append_sheet(wb, wsAdmin, "Data Pengurus");

                XLSX.writeFile(wb, `SIWASGJ_Database_${new Date().toISOString().slice(0,10)}.xlsx`);
                showToast("File Microsoft Excel (.xlsx) berhasil diunduh!");
            } catch (err) {

        const OperatorDokumentasiManager = ({ dokumentasi, setDokumentasi, syncToDatabase, showToast }) => {
            const [judul, setJudul] = useState('');
            const [newFolderFotos, setNewFolderFotos] = useState([]);
            const [addPhotoTargetId, setAddPhotoTargetId] = useState(null);
            const [extraFotos, setExtraFotos] = useState([]);

            const handleFilesToDataUrls = (files, onComplete) => {
                const fileArray = Array.from(files);
                if (fileArray.length === 0) return;
                let loaded = 0;
                const dataUrls = [];
                fileArray.forEach((file, idx) => {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        dataUrls[idx] = reader.result;
                        loaded++;
                        if (loaded === fileArray.length) {
                            onComplete(dataUrls.filter(Boolean));
                        }
                    };
                    reader.readAsDataURL(file);
                });
            };

            const handleAddFolder = (e) => {
                e.preventDefault();
                if (!judul || newFolderFotos.length === 0) {
                    showToast("Nama folder dan minimal 1 foto harus diisi/dipilih!");
                    return;
                }

                const newFolder = {
                    id: 'd_' + Date.now(),
                    judul,
                    tanggal: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }),
                    fotoList: newFolderFotos
                };

                const updated = [newFolder, ...dokumentasi];
                setDokumentasi(updated);
                syncToDatabase({ dokumentasi: updated });
                showToast(`Folder Album "${judul}" (${newFolderFotos.length} foto) berhasil dibuat!`);
                setJudul(''); 
                setNewFolderFotos([]);
            };

            const handleDeleteFolder = (id) => {
                const updated = dokumentasi.filter(d => d.id !== id);
                setDokumentasi(updated);
                syncToDatabase({ dokumentasi: updated });
                showToast("Folder album dokumentasi berhasil dihapus.");
            };

            const handleAddPhotoToFolder = (folderId) => {
                if (extraFotos.length === 0) return;
                const updated = dokumentasi.map(d => {
                    if (d.id === folderId) {
                        const existingList = d.fotoList || (d.foto ? [d.foto] : []);
                        return { ...d, fotoList: [...existingList, ...extraFotos] };
                    }
                    return d;
                });
                setDokumentasi(updated);
                syncToDatabase({ dokumentasi: updated });
                setAddPhotoTargetId(null);
                setExtraFotos([]);
                showToast("Foto berhasil ditambahkan ke folder album!");
            };

            const handleDeletePhotoFromFolder = (folderId, photoIdx) => {
                const updated = dokumentasi.map(d => {
                    if (d.id === folderId) {
                        const existingList = d.fotoList || (d.foto ? [d.foto] : []);
                        const newList = existingList.filter((_, idx) => idx !== photoIdx);
                        return { ...d, fotoList: newList };
                    }
                    return d;
                });
                setDokumentasi(updated);
                syncToDatabase({ dokumentasi: updated });
                showToast("Foto berhasil dihapus dari folder.");
            };

                            </div>
                            <div>
                                <label className="text-slate-400 text-xs mb-1 block font-semibold">Pilih File Foto (Bisa Pilih Banyak Sekaligus)</label>

                                    accept="image/*" 
                                    multiple

                                            showToast(`${urls.length} foto berhasil dimuat.`);
                                        });
                                    }}

                                    ))}
                                </div>
                            )}
                            <button type="submit" className="w-full bg-sg-green hover:bg-sg-dark text-white font-bold py-3 rounded-xl transition shadow-md flex items-center justify-center gap-2">

                            </button>
                        </form>
                    </div>

                    <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                        <h3 className="text-lg font-bold text-white mb-4">Daftar Folder Album Kegiatan Aktif</h3>
                        <div className="space-y-4">

                                                <div className="w-10 h-10 bg-emerald-500/20 text-emerald-300 rounded-xl flex items-center justify-center text-lg">
                                                    <i className="fa-solid fa-folder-closed"></i>
                                                </div>
                                                <div>
                                                    <h4 className="font-bold text-white text-sm">{d.judul}</h4>
                                                    <span className="text-[10px] text-slate-300">{d.tanggal} • <strong className="text-emerald-400">{list.length} Foto</strong></span>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <button onClick={() => setAddPhotoTargetId(addPhotoTargetId === d.id ? null : d.id)} className="bg-sky-600 hover:bg-sky-500 text-white text-xs px-3 py-1.5 rounded-lg transition font-medium flex items-center gap-1">
                                                    <i className="fa-solid fa-plus"></i> Tambah Foto
                                                </button>
                                                <button onClick={() => handleDeleteFolder(d.id)} className="bg-red-500/20 text-red-300 p-2 rounded-lg hover:bg-red-500 hover:text-white transition">
                                                    <i className="fa-solid fa-trash text-xs"></i>
                                                </button>
                                            </div>
                                        </div>

                                        {addPhotoTargetId === d.id && (
                                            <div className="bg-slate-800 p-3 rounded-xl border border-slate-500 space-y-2">
                                                <label className="text-[11px] text-slate-300 block font-semibold">Pilih File Foto Tambahan Dari Perangkat:</label>
                                                <div className="flex gap-2 items-center">
                                                    <input 
                                                        type="file" 
                                                        accept="image/*"
                                                        multiple
                                                        onChange={(e) => {
                                                            handleFilesToDataUrls(e.target.files, (urls) => {
                                                                setExtraFotos(urls);
                                                                showToast(`${urls.length} foto tambahan dipilih.`);
                                                            });
                                                        }}
                                                        className="bg-slate-700 text-white text-xs p-2 rounded-lg border border-slate-600 flex-1 file:mr-2 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:bg-sg-green file:text-white cursor-pointer"
                                                    />
                                                    <button onClick={() => handleAddPhotoToFolder(d.id)} className="bg-sg-green text-white text-xs px-4 py-2.5 rounded-lg font-bold">Simpan</button>
                                                    <button onClick={() => { setAddPhotoTargetId(null); setExtraFotos([]); }} className="bg-slate-600 text-slate-200 text-xs px-3 py-2.5 rounded-lg">Batal</button>
                                                </div>
                                                {extraFotos.length > 0 && (
                                                    <p className="text-[11px] text-emerald-400 font-semibold">{extraFotos.length} foto siap ditambahkan.</p>
                                                )}
                                            </div>
                                        )}

                                        <div className="grid grid-cols-4 sm:grid-cols-6 gap-2 pt-2 border-t border-slate-600">
                                            {list.map((url, idx) => (
                                                <div key={idx} className="relative group rounded-lg overflow-hidden border border-slate-600 aspect-square">
                                                    <img src={url} alt="" className="w-full h-full object-cover" />
                                                    <button onClick={() => handleDeletePhotoFromFolder(d.id, idx)} className="absolute top-1 right-1 bg-red-600 text-white w-5 h-5 rounded-full flex items-center justify-center text-[10px] shadow opacity-80 hover:opacity-100">
                                                        <i className="fa-solid fa-xmark"></i>
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const OperatorAdminManager = ({ adminUsers, setAdminUsers, syncToDatabase, showToast }) => {

                                </div>

                e.preventDefault();
                setCustomLogo(logoUrl.trim());
                syncToDatabase({ customLogo: logoUrl.trim() });
                showToast("Logo Pon.Pes Sunan Gunungjati berhasil diperbarui real-time!");

            const handleFileUpload = (e) => {
                const file = e.target.files[0];

                        setLogoUrl(reader.result);

                    reader.readAsDataURL(file);

        const OperatorNilaiManager = ({ studentsList, setStudentsList, syncToDatabase, showToast }) => {
            const [selectedStudentId, setSelectedStudentId] = useState(studentsList[0]?.id || '');
            const [mapelBaru, setMapelBaru] = useState('');
            const [nilaiBaru, setNilaiBaru] = useState('');

            const currentStudent = studentsList.find(s => s.id === selectedStudentId) || studentsList[0];

            const handleUpdateNilai = (nilaiId, newScore) => {
                const updatedStudents = studentsList.map(s => {
                    if (s.id === currentStudent.id) {
                        const updatedNilai = (s.nilai || []).map(n => n.id === nilaiId ? { ...n, nilai: Number(newScore) } : n);
                        return { ...s, nilai: updatedNilai };
                    }
                    return s;
                });
                setStudentsList(updatedStudents);
                syncToDatabase({ studentsList: updatedStudents });
                showToast("Nilai berhasil diperbarui!");
            };

            const handleAddMapel = (e) => {
                e.preventDefault();
                if (!mapelBaru || nilaiBaru === '') return;
                const newEntry = {
                    id: 'n_' + Date.now(),
                    mapel: mapelBaru,
                    nilai: Number(nilaiBaru)
                };
                const updatedStudents = studentsList.map(s => {
                    if (s.id === currentStudent.id) {
                        return { ...s, nilai: [...(s.nilai || []), newEntry] };
                    }
                    return s;
                });
                setStudentsList(updatedStudents);
                syncToDatabase({ studentsList: updatedStudents });
                showToast(`Mata pelajaran "${mapelBaru}" ditambahkan ke ${currentStudent.nama}!`);
                setMapelBaru(''); setNilaiBaru('');
            };

            const handleDeleteMapel = (nilaiId) => {
                const updatedStudents = studentsList.map(s => {
                    if (s.id === currentStudent.id) {
                        return { ...s, nilai: (s.nilai || []).filter(n => n.id !== nilaiId) };
                    }
                    return s;
                });
                setStudentsList(updatedStudents);
                syncToDatabase({ studentsList: updatedStudents });
                showToast("Mata pelajaran berhasil dihapus.");
            };

            if (!currentStudent) return <div className="text-white">Belum ada data santri.</div>;

            return (
                <div className="space-y-6">
                    <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">

                        <h4 className="text-xs font-bold text-slate-300 uppercase tracking-wide mb-3">Daftar Nilai {currentStudent.nama}</h4>

                                                className="bg-red-500/20 hover:bg-red-500 text-red-300 hover:text-white p-2 rounded-lg transition text-xs" title="Hapus Mapel">

                                            </button>

                                    </div>

                                <p className="text-xs text-slate-400 italic">Belum ada mata pelajaran untuk santri ini.</p>

                        </div>
                    </div>
                </div>
            );
        };

        const OperatorAbsensiManager = ({ studentsList, setStudentsList, syncToDatabase, showToast }) => {
            const [selectedStudentId, setSelectedStudentId] = useState(studentsList[0]?.id || '');
            const [tanggalAbsen, setTanggalAbsen] = useState(new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }));
            const [statusAbsen, setStatusAbsen] = useState('Hadir');

            const currentStudent = studentsList.find(s => s.id === selectedStudentId) || studentsList[0];

            const handleAddAbsensi = (e) => {
                e.preventDefault();
                if (!tanggalAbsen) return;
                const newAbsen = {
                    id: 'a_' + Date.now(),
                    tanggal: tanggalAbsen,
                    status: statusAbsen
                };
                const updatedStudents = studentsList.map(s => {
                    if (s.id === currentStudent.id) {
                        return { ...s, absensi: [newAbsen, ...(s.absensi || [])] };
                    }
                    return s;
                });
                setStudentsList(updatedStudents);
                syncToDatabase({ studentsList: updatedStudents });
                showToast(`Absensi ${statusAbsen} untuk ${currentStudent.nama} berhasil dicatat!`);
            };

            const handleDeleteAbsensi = (absenId) => {
                const updatedStudents = studentsList.map(s => {
                    if (s.id === currentStudent.id) {
                        return { ...s, absensi: (s.absensi || []).filter(a => a.id !== absenId) };
                    }
                    return s;
                });
                setStudentsList(updatedStudents);
                syncToDatabase({ studentsList: updatedStudents });
                showToast("Catatan absensi dihapus.");
            };

            if (!currentStudent) return <div className="text-white">Belum ada data santri.</div>;

            return (
                <div className="space-y-6">
                    <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                        <h3 className="text-lg font-bold text-white mb-2 flex items-center gap-2">
                            <i className="fa-solid fa-calendar-check text-sg-green"></i> Kelola Absensi Harian Per Santri
                        </h3>
                        <p className="text-xs text-slate-400 mb-4">Catat kehadiran santri (Hadir, Izin, Sakit, atau Alpha) secara individu secara real-time.</p>

                        <div className="mb-4">
                            <label className="text-xs text-slate-300 block mb-1 font-semibold">Pilih Santri</label>
                            <select 
                                value={selectedStudentId} 
                                onChange={(e) => setSelectedStudentId(e.target.value)}
                                className="w-full bg-slate-700 border border-slate-600 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-sg-green">
                                {studentsList.map(s => (
                                    <option key={s.id} value={s.id}>
                                        {s.nama} (NIS: {s.nis} - Kamar {s.kamar})
                                    </option>
                                ))}
                            </select>
                        </div>

                        <form onSubmit={handleAddAbsensi} className="bg-slate-700/50 p-4 rounded-xl border border-slate-600 mb-6 space-y-3">
                            <h4 className="text-xs font-bold text-emerald-400 uppercase tracking-wide">Catat Absensi Baru untuk {currentStudent.nama}</h4>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label className="text-[11px] text-slate-300 block mb-1">Keterangan Tanggal</label>
                                    <input 
                                        type="text" 
                                        value={tanggalAbsen} 
                                        onChange={(e) => setTanggalAbsen(e.target.value)} 
                                        placeholder="Contoh: 10 Juli 2026" 
                                        className="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white text-xs" 
                                        required 
                                    />
                                </div>
                                <div>
                                    <label className="text-[11px] text-slate-300 block mb-1">Status Kehadiran</label>
                                    <select 
                                        value={statusAbsen} 
                                        onChange={(e) => setStatusAbsen(e.target.value)}
                                        className="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white text-xs">
                                        <option value="Hadir">Hadir</option>
                                        <option value="Izin">Izin</option>
                                        <option value="Sakit">Sakit</option>
                                        <option value="Alpha">Alpha / Mangkir</option>
                                    </select>
                                </div>
                            </div>
                            <button type="submit" className="w-full bg-sg-green hover:bg-sg-dark text-white text-xs font-bold py-2.5 rounded-lg transition">
                                Simpan Absensi Santri
                            </button>
                        </form>

                        <h4 className="text-xs font-bold text-slate-300 uppercase tracking-wide mb-3">Riwayat Absensi {currentStudent.nama}</h4>
                        <div className="space-y-2">
                            {currentStudent.absensi && currentStudent.absensi.length > 0 ? (
                                currentStudent.absensi.map(a => (
                                    <div key={a.id} className="bg-slate-700 p-3.5 rounded-xl border border-slate-600 flex items-center justify-between text-sm">
                                        <span className="text-slate-200 font-medium">{a.tanggal}</span>
                                        <div className="flex items-center gap-3">
                                            <span className={`px-3 py-1 rounded-full text-xs font-bold ${
                                                a.status === 'Hadir' ? 'bg-emerald-500/20 text-emerald-300' :
                                                a.status === 'Izin' ? 'bg-amber-500/20 text-amber-300' :
                                                a.status === 'Sakit' ? 'bg-sky-500/20 text-sky-300' : 'bg-red-500/20 text-red-300'
                                            }`}>
                                                {a.status}
                                            </span>
                                            <button 
                                                onClick={() => handleDeleteAbsensi(a.id)}
                                                className="bg-red-500/20 hover:bg-red-500 text-red-300 hover:text-white p-1.5 rounded-lg transition text-xs" title="Hapus Absen">
                                                <i className="fa-solid fa-trash"></i>
                                            </button>
                                        </div>
                                    </div>
                                ))
                            ) : (
                                <p className="text-xs text-slate-400 italic">Belum ada catatan absensi untuk santri ini.</p>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const OperatorPembayaranManager = ({ studentsList, setStudentsList, syncToDatabase, showToast }) => {
            const [selectedStudentId, setSelectedStudentId] = useState(studentsList[0]?.id || '');
            const [bulanBaru, setBulanBaru] = useState('');
            const [nominalBaru, setNominalBaru] = useState('300000');
            const [statusBaru, setStatusBaru] = useState('Belum');

            const currentStudent = studentsList.find(s => s.id === selectedStudentId) || studentsList[0];

            const handleToggleStatus = (pembayaranId) => {
                const updatedStudents = studentsList.map(s => {
                    if (s.id === currentStudent.id) {
                        const updatedPembayaran = (s.pembayaran || []).map(p => {
                            if (p.id === pembayaranId) {
                                return { ...p, status: p.status === 'Lunas' ? 'Belum' : 'Lunas' };
                            }
                            return p;
                        });
                        return { ...s, pembayaran: updatedPembayaran };
                    }
                    return s;
                });
                setStudentsList(updatedStudents);
                syncToDatabase({ studentsList: updatedStudents });
                showToast("Status tagihan keuangan berhasil diperbarui real-time!");
            };

            const handleAddTagihan = (e) => {
                e.preventDefault();
                if (!bulanBaru || !nominalBaru) return;
                const formattedNominal = nominalBaru.startsWith('Rp') ? nominalBaru : `Rp${Number(nominalBaru).toLocaleString('id-ID')}`;
                const newTagihan = {
                    id: 'b_' + Date.now(),
                    bulan: bulanBaru,
                    status: statusBaru,
                    nominal: formattedNominal
                };
                const updatedStudents = studentsList.map(s => {
                    if (s.id === currentStudent.id) {
                        return { ...s, pembayaran: [newTagihan, ...(s.pembayaran || [])] };
                    }
                    return s;
                });
                setStudentsList(updatedStudents);
                syncToDatabase({ studentsList: updatedStudents });
                showToast(`Tagihan keuangan ${bulanBaru} ditambahkan ke ${currentStudent.nama}!`);
                setBulanBaru('');
            };

            const handleDeleteTagihan = (pembayaranId) => {
                const updatedStudents = studentsList.map(s => {
                    if (s.id === currentStudent.id) {
                        return { ...s, pembayaran: (s.pembayaran || []).filter(p => p.id !== pembayaranId) };
                    }
                    return s;
                });
                setStudentsList(updatedStudents);
                syncToDatabase({ studentsList: updatedStudents });
                showToast("Tagihan keuangan berhasil dihapus.");
            };

            if (!currentStudent) return <div className="text-white">Belum ada data santri.</div>;

            return (
                <div className="space-y-6">
                    <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                        <h3 className="text-lg font-bold text-white mb-2 flex items-center gap-2">
                            <i className="fa-solid fa-wallet text-sg-green"></i> Kelola Keuangan, Tagihan & SPP (Bendahara)
                        </h3>
                        <p className="text-xs text-slate-400 mb-4">Pilih santri untuk mengelola rincian keuangan, tagihan bulanan, dan status pembayaran SPP secara real-time.</p>

                        <div className="mb-4">
                            <label className="text-xs text-slate-300 block mb-1 font-semibold">Pilih Santri</label>
                            <select 
                                value={selectedStudentId} 
                                onChange={(e) => setSelectedStudentId(e.target.value)}
                                className="w-full bg-slate-700 border border-slate-600 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-sg-green">
                                {studentsList.map(s => (
                                    <option key={s.id} value={s.id}>
                                        {s.nama} (NIS: {s.nis} - Kelas {s.kelas})
                                    </option>
                                ))}
                            </select>
                        </div>

                        <form onSubmit={handleAddTagihan} className="bg-slate-700/50 p-4 rounded-xl border border-slate-600 mb-6 space-y-3">
                            <h4 className="text-xs font-bold text-emerald-400 uppercase tracking-wide">Tambah Tagihan Keuangan Baru untuk {currentStudent.nama}</h4>
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                <div>
                                    <label className="text-[11px] text-slate-300 block mb-1">Bulan / Keterangan</label>
                                    <input 
                                        type="text" 
                                        value={bulanBaru} 
                                        onChange={(e) => setBulanBaru(e.target.value)} 
                                        placeholder="Contoh: November 2026" 
                                        className="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white text-xs" 
                                        required 
                                    />
                                </div>
                                <div>
                                    <label className="text-[11px] text-slate-300 block mb-1">Nominal (Rp)</label>
                                    <input 
                                        type="text" 
                                        value={nominalBaru} 
                                        onChange={(e) => setNominalBaru(e.target.value)} 
                                        placeholder="300000" 
                                        className="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white text-xs" 
                                        required 
                                    />
                                </div>
                                <div>
                                    <label className="text-[11px] text-slate-300 block mb-1">Status Awal</label>
                                    <select 
                                        value={statusBaru} 
                                        onChange={(e) => setStatusBaru(e.target.value)}
                                        className="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white text-xs">
                                        <option value="Belum">Belum Lunas</option>
                                        <option value="Lunas">Lunas</option>
                                    </select>
                                </div>
                            </div>
                            <button type="submit" className="w-full bg-sg-green hover:bg-sg-dark text-white text-xs font-bold py-2.5 rounded-lg transition">
                                Tambah Tagihan Keuangan
                            </button>
                        </form>

                        <h4 className="text-xs font-bold text-slate-300 uppercase tracking-wide mb-3">Daftar Tagihan Keuangan {currentStudent.nama}</h4>
                        <div className="space-y-3">
                            {currentStudent.pembayaran && currentStudent.pembayaran.length > 0 ? (
                                currentStudent.pembayaran.map(b => (
                                    <div key={b.id} className="bg-slate-700 p-3.5 rounded-xl border border-slate-600 flex items-center justify-between gap-3">
                                        <div>
                                            <h5 className="text-sm font-bold text-white">{b.bulan}</h5>
                                            <p className="text-xs text-emerald-400 font-semibold">{b.nominal}</p>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <button 
                                                onClick={() => handleToggleStatus(b.id)}
                                                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                                                    b.status === 'Lunas' ? 'bg-emerald-500/20 text-emerald-300 hover:bg-emerald-500/30' : 'bg-red-500/20 text-red-300 hover:bg-red-500/30'
                                                }`}>
                                                {b.status} (Ubah Status)
                                            </button>
                                            <button 
                                                onClick={() => handleDeleteTagihan(b.id)}
                                                className="bg-red-500/20 hover:bg-red-500 text-red-300 hover:text-white p-2 rounded-lg transition text-xs" title="Hapus Tagihan">
                                                <i className="fa-solid fa-trash"></i>
                                            </button>
                                        </div>
                                    </div>
                                ))
                            ) : (
                                <p className="text-xs text-slate-400 italic">Belum ada tagihan keuangan untuk santri ini.</p>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const OperatorPerizinanManager = ({ studentsList, setStudentsList, syncToDatabase, showToast }) => {
            const handleUpdatePermissionStatus = (santriId, izinId, newStatus) => {
                const updatedStudents = studentsList.map(s => {
                    if (s.id === santriId) {
                        const updatedPerizinan = (s.perizinan || []).map(i => {
                            if (i.id === izinId) {
                                return { ...i, status: newStatus };
                            }
                            return i;
                        });
                        return { ...s, perizinan: updatedPerizinan };
                    }
                    return s;
                });
                setStudentsList(updatedStudents);
                syncToDatabase({ studentsList: updatedStudents });
                showToast(`Status perizinan diubah menjadi "${newStatus}" real-time!`);
            };

            const handleDeletePermission = (santriId, izinId) => {
                const updatedStudents = studentsList.map(s => {
                    if (s.id === santriId) {
                        return { ...s, perizinan: (s.perizinan || []).filter(i => i.id !== izinId) };
                    }
                    return s;
                });
                setStudentsList(updatedStudents);
                syncToDatabase({ studentsList: updatedStudents });
                showToast("Pengajuan izin berhasil dihapus.");
            };

            const allPermissions = [];
            studentsList.forEach(s => {
                if (s.perizinan && s.perizinan.length > 0) {
                    s.perizinan.forEach(i => {
                        allPermissions.push({ ...i, studentId: s.id, studentName: s.nama, studentClass: s.kelas });
                    });
                }
            });

            return (
                <div className="space-y-6">
                    <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                        <h3 className="text-lg font-bold text-white mb-2 flex items-center gap-2">
                            <i className="fa-solid fa-clipboard-check text-sg-green"></i> Persetujuan & Pengelolaan Izin Santri
                        </h3>
                        <p className="text-xs text-slate-400 mb-6">Tinjau, setujui, tolak, atau hapus pengajuan izin dari wali santri secara real-time.</p>

                        <div className="space-y-4">
                            {allPermissions.length > 0 ? (
                                allPermissions.map(item => (
                                    <div key={item.id} className="bg-slate-700 p-4 rounded-xl border border-slate-600 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                        <div className="space-y-1">
                                            <div className="flex items-center gap-2">
                                                <span className="text-xs font-bold bg-emerald-500/20 text-emerald-300 px-2.5 py-0.5 rounded">
                                                    {item.studentName} ({item.studentClass})
                                                </span>
                                                <span className="text-xs font-bold text-amber-400">• {item.jenis}</span>
                                                <span className="text-[10px] text-slate-400">({item.tglPengajuan})</span>
                                            </div>
                                            <p className="text-xs text-white font-medium">Tanggal Izin: <span className="text-emerald-400">{item.tanggal}</span></p>
                                            <p className="text-xs text-slate-300">Alasan: {item.alasan}</p>
                                        </div>

                                        <div className="flex items-center gap-2 w-full sm:w-auto justify-end flex-wrap">
                                            <span className={`text-xs px-2.5 py-1 rounded-full font-bold ${
                                                item.status === 'Disetujui' ? 'bg-emerald-500/20 text-emerald-300' :
                                                item.status === 'Ditolak' ? 'bg-red-500/20 text-red-300' : 'bg-amber-500/20 text-amber-300'
                                            }`}>
                                                {item.status}
                                            </span>

                                            <button 
                                                onClick={() => handleUpdatePermissionStatus(item.studentId, item.id, 'Disetujui')}
                                                className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded-lg transition" title="Setujui">
                                                <i className="fa-solid fa-check"></i> Setujui
                                            </button>
                                            <button 
                                                onClick={() => handleUpdatePermissionStatus(item.studentId, item.id, 'Ditolak')}
                                                className="bg-amber-600 hover:bg-amber-700 text-white text-xs px-3 py-1.5 rounded-lg transition" title="Tolak">
                                                <i className="fa-solid fa-xmark"></i> Tolak
                                            </button>
                                            <button 
                                                onClick={() => handleDeletePermission(item.studentId, item.id)}
                                                className="bg-red-600/80 hover:bg-red-600 text-white text-xs px-3 py-1.5 rounded-lg transition" title="Hapus">
                                                <i className="fa-solid fa-trash"></i>
                                            </button>
                                        </div>
                                    </div>
                                ))
                            ) : (
                                <p className="text-xs text-slate-400 italic text-center py-6">Belum ada pengajuan perizinan santri saat ini.</p>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const OperatorPanel = ({
            activeTabOperator, setActiveTabOperator, studentsList, setStudentsList,
            pengumuman, setPengumuman, dokumentasi, setDokumentasi, adminUsers, setAdminUsers, customLogo, setCustomLogo,
            contactInfo, setContactInfo, syncToDatabase, onLogout, showToast, adminUser
        }) => {
            const role = adminUser?.role || 'superadmin';

            const allMenu = [
                { id: 'admins', label: 'Kelola Sandi Pengurus', icon: 'fa-user-shield', roles: ['superadmin'] },
                { id: 'santri', label: 'Data, Foto & Sandi Santri', icon: 'fa-user-graduate', roles: ['superadmin', 'sekretaris'] },
                { id: 'logo', label: 'Ganti Logo Pondok', icon: 'fa-shield-halved', roles: ['superadmin', 'media'] },
                { id: 'kontak', label: 'Kelola Menu Hubungi & Sharelok', icon: 'fa-headset', roles: ['superadmin', 'sekretaris', 'media'] },
                { id: 'pengumuman', label: 'Kelola Pengumuman', icon: 'fa-bullhorn', roles: ['superadmin', 'media'] },
                { id: 'dokumentasi', label: 'Folder Dokumentasi', icon: 'fa-folder-open', roles: ['superadmin', 'media'] },
                { id: 'nilai', label: 'Nilai & Mapel Santri', icon: 'fa-book-open', roles: ['superadmin', 'sekretaris'] },
                { id: 'absensi', label: 'Absensi Per Santri', icon: 'fa-calendar-check', roles: ['superadmin', 'sekretaris'] },
                { id: 'pembayaran', label: 'Tagihan Keuangan / SPP', icon: 'fa-wallet', roles: ['superadmin', 'bendahara'] },
                { id: 'perizinan', label: 'Persetujuan Izin', icon: 'fa-clipboard-check', roles: ['superadmin', 'sekretaris'] },
                { id: 'gdrive', label: 'Backup Excel (.xlsx)', icon: 'fa-file-excel', roles: ['superadmin'] }
            ];

            const allowedMenu = allMenu.filter(item => item.roles.includes(role));

            useEffect(() => {
                if (!allowedMenu.some(m => m.id === activeTabOperator)) {
                    if (allowedMenu.length > 0) setActiveTabOperator(allowedMenu[0].id);
                }
            }, [role]);

            return (
                <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col font-sans">
                    <header className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex flex-wrap justify-between items-center sticky top-0 z-30 gap-3">
                        <div className="flex items-center gap-3">
                            <LogoSGJ className="w-10 h-10" customLogo={customLogo} />
                            <div>
                                <h1 className="font-bold text-lg leading-none text-white">Panel Pengurus SIWASGJ</h1>
                                <p className="text-xs text-emerald-400 mt-1">Login sebagai: <strong>{adminUser.nama}</strong></p>
                            </div>
                        </div>

                        <div className="flex items-center gap-3">
                            <button onClick={onLogout} className="bg-red-600 hover:bg-red-700 text-white text-xs px-4 py-2 rounded-lg font-semibold transition flex items-center gap-2 shadow-md">
                                <i className="fa-solid fa-right-from-bracket"></i> Keluar
                            </button>
                        </div>
                    </header>

                                            <div>
                                                <label className="text-xs font-semibold text-gray-600 block mb-1">Tanggal Izin</label>
                                                <input type="date" value={tanggal} onChange={(e) => setTanggal(e.target.value)} className="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm" required />
                                            </div>
                                            <div>
                                                <label className="text-xs font-semibold text-gray-600 block mb-1">Jenis Izin</label>
                                                <select value={jenis} onChange={(e) => setJenis(e.target.value)} className="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm" required>
                                                    <option value="">Pilih izin</option>
                                                    <option value="Sakit">Sakit</option>
                                                    <option value="Pulang">Pulang / Keluarga</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="text-xs font-semibold text-gray-600 block mb-1">Alasan</label>
                                                <textarea rows="3" value={alasan} onChange={(e) => setAlasan(e.target.value)} className="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm resize-none" required></textarea>
                                            </div>
                                            <button type="submit" className="w-full bg-sg-green text-white font-semibold py-2.5 rounded-xl">Kirim Pengajuan</button>
                                        </form>
                                    </div>

                                    <div className="bg-white p-5 rounded-xl border border-gray-100 shadow-sm">
                                        <h3 className="font-bold text-gray-800 mb-3">Riwayat Pengajuan Izin</h3>
                                        <div className="space-y-3">
                                            {student.perizinan && student.perizinan.length > 0 ? (
                                                student.perizinan.map((item, index) => (
                                                    <div key={item.id || index} className="p-3 bg-gray-50 rounded-lg border border-gray-100 space-y-1">
                                                        <div className="flex justify-between items-center">
                                                            <span className="text-xs font-bold text-sg-green">{item.jenis}</span>
                                                            <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${
                                                                item.status === 'Disetujui' ? 'bg-green-100 text-green-700' :
                                                                item.status === 'Ditolak' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'
                                                            }`}>{item.status}</span>
                                                        </div>
                                                        <p className="text-xs text-gray-700">{item.alasan}</p>
                                                        <span className="text-[10px] text-gray-400 block">Tanggal: {item.tanggal}</span>
                                                    </div>
                                                ))
                                            ) : (
                                                <p className="text-xs text-gray-500 text-center py-2">Belum ada riwayat perizinan.</p>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                        {currentView === 'dokumentasi' && (
                            <WaliDokumentasiView dokumentasi={dokumentasi} goBack={goBack} showToast={showToast} />
                        )}
                        {currentView === 'hubungi' && (
                            <div className="flex-1 flex flex-col bg-gray-50">
                                <SubHeader title="Hubungi Pondok & Sharelok" onBack={goBack} />
                                <div className="flex-1 overflow-y-auto p-5 space-y-4">
                                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5 space-y-4 text-sm">
                                        <div className="flex items-center gap-3">
                                            <div className="w-9 h-9 bg-green-50 text-sg-green rounded-full flex items-center justify-center flex-shrink-0">
                                                <i className="fa-solid fa-phone"></i>
                                            </div>
                                            <div className="flex-1">
                                                <p className="text-xs text-gray-400">Telepon Pesantren</p>
                                                <p className="font-semibold text-gray-800">{contact.telepon}</p>
                                            </div>
                                            <a href={`tel:${contact.telepon}`} className="bg-sg-green text-white text-xs px-3 py-1.5 rounded-lg font-bold">Telepon</a>
                                        </div>

                                        <div className="flex items-center gap-3 border-t border-gray-100 pt-3">
                                            <div className="w-9 h-9 bg-green-50 text-sg-green rounded-full flex items-center justify-center flex-shrink-0">
                                                <i className="fa-brands fa-whatsapp text-lg"></i>
                                            </div>
                                            <div className="flex-1">
                                                <p className="text-xs text-gray-400">WhatsApp Resmi</p>
                                                <p className="font-semibold text-gray-800">{contact.whatsapp}</p>
                                            </div>
                                            <a href={`https://wa.me/${contact.whatsapp.replace(/[^0-9]/g, '')}`} target="_blank" className="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold">Chat WA</a>
                                        </div>

                                        <div className="flex items-center gap-3 border-t border-gray-100 pt-3">
                                            <div className="w-9 h-9 bg-green-50 text-sg-green rounded-full flex items-center justify-center flex-shrink-0">
                                                <i className="fa-solid fa-map-marker-alt"></i>
                                            </div>
                                            <div className="flex-1">
                                                <p className="text-xs text-gray-400">Alamat & Titik Sharelok</p>
                                                <p className="font-semibold text-gray-800 text-xs leading-relaxed">{contact.alamat}</p>
                                            </div>
                                            <a href={contact.mapsUrl} target="_blank" className="bg-blue-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold flex items-center gap-1">
                                                <i className="fa-solid fa-location-dot"></i> Maps
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="bg-white border-t border-gray-100 rounded-t-2xl px-6 py-2.5 flex justify-between items-center z-30">
                            <button onClick={() => setCurrentView('beranda')} className={`flex flex-col items-center p-1.5 ${currentView === 'beranda' ? 'text-sg-green font-bold' : 'text-gray-400'}`}>
                                <i className="fa-solid fa-home text-lg mb-0.5"></i><span className="text-[10px]">Beranda</span>
                            </button>
                            <button onClick={() => setCurrentView('profil')} className={`flex flex-col items-center p-1.5 ${currentView === 'profil' ? 'text-sg-green font-bold' : 'text-gray-400'}`}>
                                <i className="fa-regular fa-user text-lg mb-0.5"></i><span className="text-[10px]">Akun</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [role, setRole] = useState('wali');
            const [adminUser, setAdminUser] = useState(null);
            const [activeStudentId, setActiveStudentId] = useState(initialStudentsList[0].id);
            const [showApkModal, setShowApkModal] = useState(false);
            const [showSecretModal, setShowSecretModal] = useState(false);
            const [isOnline, setIsOnline] = useState(true);

            const [activeTabOperator, setActiveTabOperator] = useState('admins');
            const [studentsList, setStudentsList] = useState(initialStudentsList);
            const [adminUsers, setAdminUsers] = useState(initialAdminUsers);
            const [pengumuman, setPengumuman] = useState(initialPengumuman);
            const [dokumentasi, setDokumentasi] = useState(initialDokumentasi);
            const [contactInfo, setContactInfo] = useState(initialContactInfo);
            const [customLogo, setCustomLogo] = useState('');

            const [toastMessage, setToastMessage] = useState(null);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };

            useEffect(() => {
                const unsubAuth = window.FB.onAuthStateChanged(window.FB.auth, (user) => {
                    if (user) {
                        const dbRef = window.FB.ref(window.FB.db, "siwasgj_data");
                        window.FB.onValue(dbRef, (snapshot) => {
                            const data = snapshot.val();
                            
                            let currentAdminUsers = initialAdminUsers;
                            let currentStudentsList = initialStudentsList;
                            
                            if (data) {
                                if (data.studentsList) { setStudentsList(data.studentsList); currentStudentsList = data.studentsList; }
                                if (data.adminUsers) { setAdminUsers(data.adminUsers); currentAdminUsers = data.adminUsers; }
                                if (data.pengumuman) setPengumuman(data.pengumuman);
                                if (data.dokumentasi) setDokumentasi(data.dokumentasi);
                                if (data.contactInfo) setContactInfo(data.contactInfo);
                                if (data.customLogo !== undefined) setCustomLogo(data.customLogo);
                                setIsOnline(true);
                            } else {
                                window.FB.set(dbRef, {
                                    studentsList: initialStudentsList,
                                    adminUsers: initialAdminUsers,
                                    pengumuman: initialPengumuman,
                                    dokumentasi: initialDokumentasi,
                                    contactInfo: initialContactInfo,
                                    customLogo: ''
                                });
                            }

                            // Cek login admin atau wali
                            const prefix = user.email.split('@')[0];
                            const foundAdmin = currentAdminUsers.find(a => a.username === prefix);
                            
                            if (foundAdmin) {
                                setRole('operator'); 
                                setAdminUser(foundAdmin); 
                                setIsLoggedIn(true);
                                
                                if (foundAdmin.role === 'superadmin') setActiveTabOperator('admins');
                                else if (foundAdmin.role === 'bendahara') setActiveTabOperator('pembayaran');
                                else if (foundAdmin.role === 'media') setActiveTabOperator('logo');
                                else if (foundAdmin.role === 'sekretaris') setActiveTabOperator('santri');
                            } else {
                                const foundStudent = currentStudentsList.find(s => s.nis === prefix);
                                if (foundStudent) {
                                    setRole('wali'); 
                                    setActiveStudentId(foundStudent.id); 
                                    setIsLoggedIn(true);
                                }
                            }
                        }, (err) => {
                            setIsOnline(false);
                            showToast("Gagal mengambil data: " + err.message);
                        });
                    } else {
                        setIsLoggedIn(false);
                        setAdminUser(null);
                    }
                });
                
                return () => unsubAuth();
            }, []);

            const syncToDatabase = async (updatedFields) => {
                try {
                    const dbRef = window.FB.ref(window.FB.db, "siwasgj_data");
                    await window.FB.update(dbRef, updatedFields);
                    setIsOnline(true);
                } catch (err) {
                    setIsOnline(false);
                    showToast("Gagal menyinkronkan data ke server (Offline).");
                }
            };

            const handleLogout = () => {
                window.FB.signOut(window.FB.auth);
                setIsLoggedIn(false);
                setAdminUser(null);
                showToast("Anda telah keluar dengan aman.");
            };

            const activeStudent = studentsList.find(s => s.id === activeStudentId) || studentsList[0];

            return (
                <React.Fragment>
                    <div className={`fixed bottom-4 left-4 z-[9999] px-3 py-1.5 rounded-full text-[10px] font-bold flex items-center gap-2 shadow-lg ${isOnline ? 'bg-emerald-500 text-white' : 'bg-red-500 text-white'}`}>
                        <span className={`w-2 h-2 rounded-full ${isOnline ? 'bg-white' : 'bg-white animate-pulse'}`}></span>
                        {isOnline ? "TERHUBUNG (Firebase Auth V2)" : "OFFLINE / GAGAL"}
                    </div>

                    {toastMessage && (
                        <div className="fixed top-5 right-5 z-50 bg-slate-800 border border-slate-700 text-white text-xs px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 animate-bounce">
                            <i className="fa-solid fa-circle-check text-sg-green text-base"></i>
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    {showApkModal && <ApkDownloadModal onClose={() => setShowApkModal(false)} showToast={showToast} customLogo={customLogo} studentsList={studentsList} pengumuman={pengumuman} adminUsers={adminUsers} />}
                    {showSecretModal && <SecretInfoModal onClose={() => setShowSecretModal(false)} />}

                    {!isLoggedIn ? (
                        <LoginScreen 
                            onOpenApkModal={() => setShowApkModal(true)} 
                            onOpenSecret={() => setShowSecretModal(true)} 
                            customLogo={customLogo}
                            adminUsers={adminUsers}
                            studentsList={studentsList}
                        />
                    ) : role === 'operator' ? (
                        <OperatorPanel 
                            activeTabOperator={activeTabOperator}
                            setActiveTabOperator={setActiveTabOperator}
                            studentsList={studentsList}
                            setStudentsList={setStudentsList}
                            pengumuman={pengumuman}
                            setPengumuman={setPengumuman}
                            dokumentasi={dokumentasi}
                            setDokumentasi={setDokumentasi}
                            adminUsers={adminUsers}
                            setAdminUsers={setAdminUsers}
                            customLogo={customLogo}
                            setCustomLogo={setCustomLogo}
                            contactInfo={contactInfo}
                            setContactInfo={setContactInfo}
                            syncToDatabase={syncToDatabase}
                            onLogout={handleLogout}
                            showToast={showToast}
                            adminUser={adminUser}
                        />
                    ) : (
                        <WaliApp 
                            student={activeStudent}
                            studentsList={studentsList}
                            setStudentsList={setStudentsList}
                            pengumuman={pengumuman}
                            dokumentasi={dokumentasi}
                            customLogo={customLogo}
                            contactInfo={contactInfo}
                            syncToDatabase={syncToDatabase}
                            showToast={showToast}
                            onLogout={handleLogout}
                            onOpenApkModal={() => setShowApkModal(true)}
                        />
                    )}
                </React.Fragment>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
